<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Northwind</title>
  <meta name="theme-color" content="#c9a36a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Ask Northwind" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <main>
    <header class="site-header">
      <h1><a href="/">Ask Northwind</a></h1>
      <nav>
        <a href="/" class="active">Ask</a>
        <a href="/library">Library</a>
      </nav>
    </header>
    <p class="lede">Internal assistant for Northwind Retail Co. Answers come only from company docs — you will see which excerpts were retrieved before the model writes. A follow-up keeps this conversation. New chat starts a fresh session.</p>
    <p id="index-note" class="index-note" hidden></p>
    <div id="thread"></div>

    <form id="ask-form">
      <p id="status" class="idle">Ready</p>
      <textarea id="question" rows="2" autocomplete="off" aria-label="Question"
                placeholder="How many PTO days do I get per year?"></textarea>
      <div class="ask-actions">
        <button type="submit" id="ask">Ask</button>
        <button type="button" class="ghost" id="new-chat" disabled>New chat</button>
        <span id="conn">disconnected</span>
        <button type="button" class="ghost" id="reconnect">Reconnect</button>
      </div>
    </form>
  </main>
  <script>
    const form = document.getElementById("ask-form");
    const input = document.getElementById("question");
    const askBtn = document.getElementById("ask");
    const newChatBtn = document.getElementById("new-chat");
    const statusEl = document.getElementById("status");
    const threadEl = document.getElementById("thread");
    const connEl = document.getElementById("conn");
    const reconnectBtn = document.getElementById("reconnect");
    const indexNote = document.getElementById("index-note");

    const STORAGE_KEY = "ask-northwind-chat";
    const NO_INFO = "I don't have information about that in the available documents.";
    const REBUILD_MSG = "Index is rebuilding. Try again when it finishes.";
    const STAGE = {
      rewriting: "Reading the conversation…",
      retrieving: "Searching documents…",
      generating: "Writing answer…",
    };

    let ws = null;
    let answering = false;
    let rebuilding = false;
    let epoch = 0;
    let active = null;
    let committed = [];

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (ch) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])
      );
    }

    function renderInline(text) {
      const bits = [];
      const re = /`([^`]+)`/g;
      let last = 0;
      let m;
      while ((m = re.exec(text))) {
        bits.push({ t: "text", v: text.slice(last, m.index) });
        bits.push({ t: "code", v: m[1] });
        last = m.index + m[0].length;
      }
      bits.push({ t: "text", v: text.slice(last) });
      return bits.map((bit) => {
        if (bit.t === "code") return `<code>${escapeHtml(bit.v)}</code>`;
        let s = escapeHtml(bit.v);
        s = s.replace(
          /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
          (_, label, href) =>
            `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`
        );
        s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/\*(.+?)\*/g, "<em>$1</em>");
        s = s.replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
        return s;
      }).join("");
    }

    function splitTableRow(line) {
      let s = line.trim();
      if (s.startsWith("|")) s = s.slice(1);
      if (s.endsWith("|")) s = s.slice(0, -1);
      return s.split("|").map((c) => c.trim());
    }

    function isTableSep(line) {
      if (!line || !line.includes("-")) return false;
      const cells = splitTableRow(line);
      return cells.length > 0 && cells.every((c) => /^:?-{3,}:?$/.test(c));
    }

    function renderMarkdown(src) {
      const fences = [];
      let text = String(src || "").replace(/\r\n/g, "\n");
      text = text.replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => {
        const i = fences.length;
        fences.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ""))}</code></pre>`);
        return `\n\n%%FENCE${i}%%\n\n`;
      });
      const open = text.match(/```[\w-]*\n?([\s\S]*)$/);
      if (open) {
        const i = fences.length;
        fences.push(`<pre><code>${escapeHtml(open[1])}</code></pre>`);
        text = text.slice(0, open.index) + `\n\n%%FENCE${i}%%\n\n`;
      }

      const lines = text.split("\n");
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (/^\s*$/.test(line)) {
          i += 1;
          continue;
        }
        const fence = line.trim().match(/^%%FENCE(\d+)%%$/);
        if (fence) {
          out.push(fences[Number(fence[1])]);
          i += 1;
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const n = heading[1].length;
          out.push(`<h${n}>${renderInline(heading[2].trim())}</h${n}>`);
          i += 1;
          continue;
        }
        if (/^ {0,3}([-*_])\1{2,}\s*$/.test(line)) {
          out.push("<hr>");
          i += 1;
          continue;
        }
        if (/^>\s?/.test(line)) {
          const quote = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) {
            quote.push(lines[i].replace(/^>\s?/, ""));
            i += 1;
          }
          out.push(`<blockquote>${renderMarkdown(quote.join("\n"))}</blockquote>`);
          continue;
        }
        if (line.includes("|") && isTableSep(lines[i + 1] || "")) {
          const header = splitTableRow(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
            rows.push(splitTableRow(lines[i]));
            i += 1;
          }
          let html = "<table><thead><tr>" +
            header.map((h) => `<th>${renderInline(h)}</th>`).join("") +
            "</tr></thead><tbody>";
          for (const row of rows) {
            html += "<tr>" + row.map((c) => `<td>${renderInline(c)}</td>`).join("") + "</tr>";
          }
          html += "</tbody></table>";
          out.push(html);
          continue;
        }
        if (/^\s*[-*+]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
            items.push(`<li>${renderInline(lines[i].replace(/^\s*[-*+]\s+/, ""))}</li>`);
            i += 1;
          }
          out.push(`<ul>${items.join("")}</ul>`);
          continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(`<li>${renderInline(lines[i].replace(/^\s*\d+\.\s+/, ""))}</li>`);
            i += 1;
          }
          out.push(`<ol>${items.join("")}</ol>`);
          continue;
        }
        const para = [];
        while (i < lines.length) {
          const cur = lines[i];
          if (/^\s*$/.test(cur)) break;
          if (/^%%FENCE\d+%%$/.test(cur.trim())) break;
          if (/^(#{1,3})\s+/.test(cur)) break;
          if (/^ {0,3}([-*_])\1{2,}\s*$/.test(cur)) break;
          if (/^>\s?/.test(cur)) break;
          if (/^\s*[-*+]\s+/.test(cur)) break;
          if (/^\s*\d+\.\s+/.test(cur)) break;
          if (cur.includes("|") && isTableSep(lines[i + 1] || "")) break;
          para.push(cur);
          i += 1;
        }
        out.push(`<p>${renderInline(para.join("\n")).replace(/\n/g, "<br>")}</p>`);
      }
      return out.join("");
    }

    function setConn(state) {
      connEl.className = state;
      connEl.textContent = state;
      reconnectBtn.classList.toggle("show", state !== "connected");
    }

    function syncComposer() {
      const locked = rebuilding || answering;
      input.disabled = locked;
      askBtn.disabled = locked;
      newChatBtn.disabled = threadEl.childElementCount === 0 && !answering;
      input.placeholder = committed.length
        ? "Ask a follow-up…"
        : "How many PTO days do I get per year?";
    }

    function setBusy(busy) {
      answering = busy;
      syncComposer();
    }

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    function setIndexNote(stale) {
      indexNote.replaceChildren();
      if (!stale) {
        indexNote.hidden = true;
        return;
      }
      indexNote.hidden = false;
      indexNote.append("The library has changed since the last Re-index. Answers still use the previous index. ");
      const link = document.createElement("a");
      link.href = "/library";
      link.textContent = "Re-index on the Library page.";
      indexNote.append(link);
    }

    function setRebuildLock(locked) {
      rebuilding = locked;
      syncComposer();
      if (locked) setStatus(REBUILD_MSG, "err");
    }

    function persist() {
      try {
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ turns: committed }));
      } catch (err) {
        // The thread still lives in this page if storage is unavailable.
      }
    }

    function loadCommitted() {
      try {
        const raw = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "null");
        if (!raw || !Array.isArray(raw.turns)) return [];
        return raw.turns.filter((turn) =>
          turn && typeof turn.question === "string" && typeof turn.answer === "string" && turn.answer.trim()
        );
      } catch (err) {
        return [];
      }
    }

    function closeExcerpts() {
      threadEl.querySelectorAll("details").forEach((node) => {
        node.open = false;
      });
    }

    function appendTurn(question) {
      closeExcerpts();
      const article = document.createElement("article");
      article.className = "turn";
      const you = document.createElement("p");
      you.className = "who";
      you.textContent = "You";
      const asked = document.createElement("p");
      asked.className = "user-q";
      asked.textContent = question;
      const bot = document.createElement("p");
      bot.className = "who";
      bot.textContent = "Northwind";
      const details = document.createElement("details");
      details.open = true;
      const summary = document.createElement("summary");
      summary.textContent = "Excerpts";
      const excerpts = document.createElement("div");
      excerpts.className = "chunks";
      details.append(summary, excerpts);
      const answer = document.createElement("div");
      answer.className = "answer";
      article.append(you, asked, bot, details, answer);
      threadEl.append(article);
      article.scrollIntoView({ block: "end" });
      return {
        epoch,
        question,
        query: "",
        ranking: "",
        chunks: [],
        md: "",
        details,
        excerptsEl: excerpts,
        answerEl: answer,
      };
    }

    function showSources(turn, chunks, ranking) {
      turn.chunks = chunks;
      turn.ranking = ranking;
      const el = turn.excerptsEl;
      el.replaceChildren();
      if (turn.query && turn.query !== turn.question) {
        const line = document.createElement("p");
        line.className = "search-as";
        line.textContent = "Follow-up searched as: " + turn.query;
        el.append(line);
      }
      if (!chunks.length) {
        const empty = document.createElement("p");
        empty.className = "preview";
        empty.textContent = "No matching excerpts.";
        el.append(empty);
        return;
      }
      const note = document.createElement("p");
      note.className = "preview";
      note.textContent = ranking === "rerank"
        ? "Ordered by the reranker."
        : "Reranker scores were below 0, so these stay in vector-search order.";
      el.append(note);
      for (const chunk of chunks) {
        const card = document.createElement("article");
        card.className = "chunk";
        const meta = document.createElement("div");
        meta.className = "meta";
        const kind = chunk.expanded ? "section" : "excerpt";
        meta.textContent = `[${chunk.n}] ${chunk.source_file} · ${kind}`;
        const preview = document.createElement("div");
        preview.className = "preview";
        preview.textContent = chunk.preview;
        card.append(meta, preview);
        el.append(card);
      }
    }

    function commitActive() {
      if (!active || !active.md.trim()) return;
      committed.push({
        question: active.question,
        answer: active.md,
        ranking: active.ranking || "vector",
        query: active.query || "",
        chunks: active.chunks || [],
      });
      active = null;
      persist();
      syncComposer();
    }

    function historyPayload() {
      const history = [];
      for (const turn of committed) {
        history.push({ role: "user", content: turn.question });
        history.push({ role: "assistant", content: turn.answer });
      }
      return history;
    }

    function renderSaved(turn) {
      const view = appendTurn(turn.question);
      view.query = turn.query || "";
      view.md = turn.answer;
      view.answerEl.innerHTML = renderMarkdown(turn.answer);
      showSources(view, Array.isArray(turn.chunks) ? turn.chunks : [], turn.ranking || "vector");
      view.details.open = false;
    }

    let pollTimer = null;

    function stopRebuildPoll() {
      if (pollTimer === null) return;
      clearTimeout(pollTimer);
      pollTimer = null;
    }

    function startRebuildPoll() {
      if (pollTimer !== null) return;
      pollTimer = setTimeout(pollRebuild, 1000);
    }

    async function pollRebuild() {
      pollTimer = null;
      try {
        const res = await fetch("/api/status");
        const body = await res.json().catch(() => ({}));
        setIndexNote(Boolean(body.stale));
        if (body.rebuilding) {
          setRebuildLock(true);
          startRebuildPoll();
          return;
        }
        setRebuildLock(false);
        if (!answering) setStatus("Ready", "idle");
      } catch (err) {
        startRebuildPoll();
      }
    }

    async function checkRebuildOnLoad() {
      try {
        const res = await fetch("/api/status");
        const body = await res.json().catch(() => ({}));
        setIndexNote(Boolean(body.stale));
        if (body.rebuilding) {
          setRebuildLock(true);
          startRebuildPoll();
        }
      } catch (err) {
        // Idle or offline: do not poll.
      }
    }

    function connect() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        return;
      }
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => setConn("connected");
      ws.onerror = () => setConn("error");
      ws.onclose = () => {
        setConn("disconnected");
        setBusy(false);
        if (!rebuilding) setStatus("Ready", "idle");
      };
      ws.onmessage = (ev) => handle(JSON.parse(ev.data));
    }

    function currentTurn() {
      return active && active.epoch === epoch ? active : null;
    }

    function handle(event) {
      const turn = currentTurn();
      if (event.type === "status") {
        setStatus(STAGE[event.stage] || event.stage);
        if (turn && event.query) turn.query = event.query;
        return;
      }
      if (event.type === "sources") {
        if (!turn) return;
        showSources(turn, event.chunks || [], event.ranking || "vector");
        return;
      }
      if (event.type === "token") {
        if (!turn || !event.text) return;
        turn.md += event.text;
        turn.answerEl.innerHTML = renderMarkdown(turn.md);
        const gap = document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
        if (gap < 160) turn.answerEl.scrollIntoView({ block: "end" });
        return;
      }
      if (event.type === "done") {
        if (!turn) return;
        commitActive();
        setBusy(false);
        setStatus("Ready", "idle");
        input.focus();
        return;
      }
      if (event.type === "cancelled") {
        setBusy(false);
        if (!rebuilding) setStatus("Ready", "idle");
        return;
      }
      if (event.type === "error") {
        if (event.message === REBUILD_MSG) {
          setRebuildLock(true);
          startRebuildPoll();
          if (turn) setBusy(false);
          return;
        }
        if (!turn) return;
        if (event.message === NO_INFO) {
          turn.md = NO_INFO;
          turn.answerEl.innerHTML = renderMarkdown(NO_INFO);
          commitActive();
          setBusy(false);
          setStatus("Ready", "idle");
          input.focus();
          return;
        }
        setBusy(false);
        setStatus(event.message, "err");
        input.focus();
      }
    }

    function ask(event) {
      event.preventDefault();
      const question = input.value.trim();
      if (!question || answering) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        setStatus("Not connected. Use Reconnect.", "err");
        return;
      }
      const history = historyPayload();
      active = appendTurn(question);
      input.value = "";
      setStatus("Sending…");
      setBusy(true);
      ws.send(JSON.stringify({ question, history }));
    }

    function newChat() {
      const wasAnswering = answering;
      epoch += 1;
      active = null;
      committed = [];
      threadEl.replaceChildren();
      try {
        sessionStorage.removeItem(STORAGE_KEY);
      } catch (err) {
        // The cleared page is enough when storage is unavailable.
      }
      input.value = "";
      if (wasAnswering && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ cancel: true }));
      } else {
        setBusy(false);
        if (!rebuilding) setStatus("Ready", "idle");
      }
      syncComposer();
      input.focus();
    }

    form.addEventListener("submit", ask);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
    newChatBtn.addEventListener("click", newChat);
    reconnectBtn.addEventListener("click", connect);
    committed = loadCommitted();
    committed.forEach(renderSaved);
    const lastDetails = threadEl.querySelector(".turn:last-child details");
    if (lastDetails) lastDetails.open = true;
    syncComposer();
    connect();
    checkRebuildOnLoad();
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") checkRebuildOnLoad();
    });
    input.focus();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
