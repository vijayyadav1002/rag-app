<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Northwind</title>
  <meta name="theme-color" content="#c9a36a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Ask Northwind" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <main>
    <header class="site-header">
      <h1><a href="/">Ask Northwind</a></h1>
      <nav>
        <a href="/" class="active">Ask</a>
        <a href="/library">Library</a>
      </nav>
    </header>
    <p class="lede">Internal assistant for Northwind Retail Co. Answers come only from company docs — you will see which excerpts were retrieved before the model writes.</p>

    <form id="ask-form">
      <input id="question" type="text" autocomplete="off"
             placeholder="How many PTO days do I get per year?" />
      <button type="submit" id="ask">Ask</button>
    </form>

    <section class="panel" aria-live="polite">
      <h2>Pipeline</h2>
      <p id="status" class="idle">Ready</p>
      <div id="chunks"></div>
    </section>

    <section class="panel">
      <h2>Answer</h2>
      <div id="answer" class="md"></div>
    </section>

    <footer>
      <span id="conn">disconnected</span>
      <button type="button" class="ghost" id="reconnect">Reconnect</button>
    </footer>
  </main>
  <script>
    const form = document.getElementById("ask-form");
    const input = document.getElementById("question");
    const askBtn = document.getElementById("ask");
    const statusEl = document.getElementById("status");
    const chunksEl = document.getElementById("chunks");
    const answerEl = document.getElementById("answer");
    const connEl = document.getElementById("conn");
    const reconnectBtn = document.getElementById("reconnect");

    let ws = null;
    let answering = false;
    let rebuilding = false;
    let answerMd = "";
    const REBUILD_MSG = "Index is rebuilding. Try again when it finishes.";

    const STAGE = {
      retrieving: "Searching documents…",
      generating: "Writing answer…",
    };

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (ch) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])
      );
    }

    function renderInline(text) {
      const bits = [];
      const re = /`([^`]+)`/g;
      let last = 0;
      let m;
      while ((m = re.exec(text))) {
        bits.push({ t: "text", v: text.slice(last, m.index) });
        bits.push({ t: "code", v: m[1] });
        last = m.index + m[0].length;
      }
      bits.push({ t: "text", v: text.slice(last) });
      return bits.map((bit) => {
        if (bit.t === "code") return `<code>${escapeHtml(bit.v)}</code>`;
        let s = escapeHtml(bit.v);
        s = s.replace(
          /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
          (_, label, href) =>
            `<a href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`
        );
        s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/\*(.+?)\*/g, "<em>$1</em>");
        s = s.replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
        return s;
      }).join("");
    }

    function splitTableRow(line) {
      let s = line.trim();
      if (s.startsWith("|")) s = s.slice(1);
      if (s.endsWith("|")) s = s.slice(0, -1);
      return s.split("|").map((c) => c.trim());
    }

    function isTableSep(line) {
      if (!line || !line.includes("-")) return false;
      const cells = splitTableRow(line);
      return cells.length > 0 && cells.every((c) => /^:?-{3,}:?$/.test(c));
    }

    function renderMarkdown(src) {
      const fences = [];
      let text = String(src || "").replace(/\r\n/g, "\n");
      text = text.replace(/```[\w-]*\n?([\s\S]*?)```/g, (_, code) => {
        const i = fences.length;
        fences.push(`<pre><code>${escapeHtml(code.replace(/\n$/, ""))}</code></pre>`);
        return `\n\n%%FENCE${i}%%\n\n`;
      });
      const open = text.match(/```[\w-]*\n?([\s\S]*)$/);
      if (open) {
        const i = fences.length;
        fences.push(`<pre><code>${escapeHtml(open[1])}</code></pre>`);
        text = text.slice(0, open.index) + `\n\n%%FENCE${i}%%\n\n`;
      }

      const lines = text.split("\n");
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (/^\s*$/.test(line)) {
          i += 1;
          continue;
        }
        const fence = line.trim().match(/^%%FENCE(\d+)%%$/);
        if (fence) {
          out.push(fences[Number(fence[1])]);
          i += 1;
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          const n = heading[1].length;
          out.push(`<h${n}>${renderInline(heading[2].trim())}</h${n}>`);
          i += 1;
          continue;
        }
        if (/^ {0,3}([-*_])\1{2,}\s*$/.test(line)) {
          out.push("<hr>");
          i += 1;
          continue;
        }
        if (/^>\s?/.test(line)) {
          const quote = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) {
            quote.push(lines[i].replace(/^>\s?/, ""));
            i += 1;
          }
          out.push(`<blockquote>${renderMarkdown(quote.join("\n"))}</blockquote>`);
          continue;
        }
        if (line.includes("|") && isTableSep(lines[i + 1] || "")) {
          const header = splitTableRow(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
            rows.push(splitTableRow(lines[i]));
            i += 1;
          }
          let html = "<table><thead><tr>" +
            header.map((h) => `<th>${renderInline(h)}</th>`).join("") +
            "</tr></thead><tbody>";
          for (const row of rows) {
            html += "<tr>" + row.map((c) => `<td>${renderInline(c)}</td>`).join("") + "</tr>";
          }
          html += "</tbody></table>";
          out.push(html);
          continue;
        }
        if (/^\s*[-*+]\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
            items.push(`<li>${renderInline(lines[i].replace(/^\s*[-*+]\s+/, ""))}</li>`);
            i += 1;
          }
          out.push(`<ul>${items.join("")}</ul>`);
          continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(`<li>${renderInline(lines[i].replace(/^\s*\d+\.\s+/, ""))}</li>`);
            i += 1;
          }
          out.push(`<ol>${items.join("")}</ol>`);
          continue;
        }
        const para = [];
        while (i < lines.length) {
          const cur = lines[i];
          if (/^\s*$/.test(cur)) break;
          if (/^%%FENCE\d+%%$/.test(cur.trim())) break;
          if (/^(#{1,3})\s+/.test(cur)) break;
          if (/^ {0,3}([-*_])\1{2,}\s*$/.test(cur)) break;
          if (/^>\s?/.test(cur)) break;
          if (/^\s*[-*+]\s+/.test(cur)) break;
          if (/^\s*\d+\.\s+/.test(cur)) break;
          if (cur.includes("|") && isTableSep(lines[i + 1] || "")) break;
          para.push(cur);
          i += 1;
        }
        out.push(`<p>${renderInline(para.join("\n")).replace(/\n/g, "<br>")}</p>`);
      }
      return out.join("");
    }

    function setAnswer(md) {
      answerMd = md;
      answerEl.innerHTML = renderMarkdown(md);
    }

    function setConn(state) {
      connEl.className = state;
      connEl.textContent = state;
      reconnectBtn.classList.toggle("show", state !== "connected");
    }

    function setBusy(busy) {
      answering = busy;
      input.disabled = busy || rebuilding;
      askBtn.disabled = busy || rebuilding;
    }

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || "";
    }

    function setRebuildLock(locked) {
      rebuilding = locked;
      input.disabled = locked || answering;
      askBtn.disabled = locked || answering;
      if (locked) setStatus(REBUILD_MSG, "err");
    }

    let pollTimer = null;

    function stopRebuildPoll() {
      if (pollTimer === null) return;
      clearTimeout(pollTimer);
      pollTimer = null;
    }

    function startRebuildPoll() {
      if (pollTimer !== null) return;
      pollTimer = setTimeout(pollRebuild, 1000);
    }

    async function pollRebuild() {
      pollTimer = null;
      try {
        const res = await fetch("/api/status");
        const body = await res.json().catch(() => ({}));
        if (body.rebuilding) {
          setRebuildLock(true);
          startRebuildPoll();
          return;
        }
        setRebuildLock(false);
        setStatus("Ready", "idle");
      } catch (err) {
        startRebuildPoll();
      }
    }

    async function checkRebuildOnLoad() {
      try {
        const res = await fetch("/api/status");
        const body = await res.json().catch(() => ({}));
        if (body.rebuilding) {
          setRebuildLock(true);
          startRebuildPoll();
        }
      } catch (err) {
        // Idle or offline: do not poll.
      }
    }

    function connect() {
      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
        return;
      }
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => setConn("connected");
      ws.onerror = () => setConn("error");
      ws.onclose = () => {
        setConn("disconnected");
        setBusy(false);
        if (!rebuilding) setStatus("Ready", "idle");
      };
      ws.onmessage = (ev) => handle(JSON.parse(ev.data));
    }

    function handle(event) {
      if (event.type === "status") {
        setStatus(STAGE[event.stage] || event.stage);
        return;
      }
      if (event.type === "sources") {
        chunksEl.replaceChildren();
        if (!event.chunks.length) {
          const empty = document.createElement("p");
          empty.className = "preview";
          empty.textContent = "No matching excerpts.";
          chunksEl.appendChild(empty);
          return;
        }
        for (const chunk of event.chunks) {
          const card = document.createElement("article");
          card.className = "chunk";
          const meta = document.createElement("div");
          meta.className = "meta";
          const kind = chunk.expanded ? "section" : "excerpt";
          meta.textContent = `[${chunk.n}] ${chunk.source_file} · ${kind}`;
          const preview = document.createElement("div");
          preview.className = "preview";
          preview.textContent = chunk.preview;
          card.append(meta, preview);
          chunksEl.appendChild(card);
        }
        return;
      }
      if (event.type === "token") {
        setAnswer(answerMd + event.text);
        return;
      }
      if (event.type === "done") {
        setBusy(false);
        setStatus("Ready", "idle");
        input.focus();
        return;
      }
      if (event.type === "error") {
        setBusy(false);
        if (event.message === REBUILD_MSG) {
          setRebuildLock(true);
          startRebuildPoll();
          return;
        }
        setStatus(event.message, "err");
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question || answering) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        setStatus("Not connected. Use Reconnect.", "err");
        return;
      }
      chunksEl.replaceChildren();
      setAnswer("");
      setStatus("Sending…");
      setBusy(true);
      ws.send(JSON.stringify({ question }));
    });

    reconnectBtn.addEventListener("click", connect);
    connect();
    checkRebuildOnLoad();
    input.focus();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
