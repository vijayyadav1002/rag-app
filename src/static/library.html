<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Library · Ask Northwind</title>
  <meta name="theme-color" content="#c9a36a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Ask Northwind" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <main>
    <header class="site-header">
      <h1><a href="/">Ask Northwind</a></h1>
      <nav>
        <a href="/">Ask</a>
        <a href="/library" class="active">Library</a>
      </nav>
    </header>

    <section class="panel" id="review-panel">
      <h2>Review</h2>
      <p id="review-status"></p>
      <div id="review-list"></div>
      <div id="editor" hidden>
        <textarea id="draft" spellcheck="false"></textarea>
        <div class="lib-actions">
          <button type="button" id="format-draft">Format</button>
          <button type="button" id="save-draft">Save draft</button>
          <button type="button" id="approve-draft">Approve</button>
          <button type="button" id="reload-live" class="ghost">Reload live file</button>
        </div>
        <p id="editor-status"></p>
      </div>
    </section>

    <section class="panel" id="library">
      <h2>Library</h2>
      <p id="lib-status">Loading documents…</p>
      <div id="doc-list"></div>
      <div class="lib-actions">
        <button type="button" id="upload">Upload .md</button>
        <input id="doc-file" type="file" accept=".md,text/markdown" multiple />
        <button type="button" id="reindex">Re-index</button>
      </div>
    </section>
  </main>
  <script>
    const libStatus = document.getElementById("lib-status");
    const docList = document.getElementById("doc-list");
    const uploadBtn = document.getElementById("upload");
    const fileInput = document.getElementById("doc-file");
    const reindexBtn = document.getElementById("reindex");
    const reviewStatus = document.getElementById("review-status");
    const reviewList = document.getElementById("review-list");
    const editor = document.getElementById("editor");
    const draft = document.getElementById("draft");
    const editorStatus = document.getElementById("editor-status");
    const formatBtn = document.getElementById("format-draft");
    const saveBtn = document.getElementById("save-draft");
    const approveBtn = document.getElementById("approve-draft");
    const reloadBtn = document.getElementById("reload-live");
    const STATE_LABEL = {
      indexed: "indexed",
      changed: "changed",
      not_indexed: "not indexed",
      missing_on_disk: "missing on disk",
    };

    let rebuilding = false;
    let proposals = [];
    let openTarget = null;

    function encPath(name) {
      return name.split("/").map(encodeURIComponent).join("/");
    }

    function detail(body, fallback) {
      if (!body) return fallback;
      if (typeof body.detail === "string") return body.detail;
      return fallback;
    }

    function isOffline() {
      return !navigator.onLine;
    }

    function setLibStatus(text, kind) {
      libStatus.textContent = text;
      libStatus.className = kind || "";
    }

    function setRebuildLock(locked) {
      rebuilding = locked;
      uploadBtn.disabled = locked;
      reindexBtn.disabled = locked;
      formatBtn.disabled = locked;
      saveBtn.disabled = locked;
      approveBtn.disabled = locked;
      reloadBtn.disabled = locked;
      docList.querySelectorAll("button").forEach((b) => { b.disabled = locked; });
      reviewList.querySelectorAll("button").forEach((b) => { b.disabled = locked; });
      reindexBtn.textContent = locked ? "Rebuilding…" : "Re-index";
    }

    let pollTimer = null;

    function stopRebuildPoll() {
      if (pollTimer === null) return;
      clearTimeout(pollTimer);
      pollTimer = null;
    }

    function startRebuildPoll() {
      if (pollTimer !== null) return;
      pollTimer = setTimeout(pollRebuild, 1000);
    }

    async function pollRebuild() {
      pollTimer = null;
      try {
        const res = await fetch("/api/status");
        const body = await res.json().catch(() => ({}));
        if (body.rebuilding) {
          setRebuildLock(true);
          setLibStatus("Rebuilding…");
          startRebuildPoll();
          return;
        }
        setRebuildLock(false);
        await refreshAll();
      } catch (err) {
        setLibStatus("You're offline.", "err");
        startRebuildPoll();
      }
    }

    function renderDocs(docs) {
      docList.replaceChildren();
      if (!docs.length) {
        const empty = document.createElement("p");
        empty.className = "preview";
        empty.textContent = "No markdown files.";
        docList.appendChild(empty);
        return;
      }
      for (const doc of docs) {
        const row = document.createElement("div");
        row.className = "row";
        const left = document.createElement("div");
        left.textContent = doc.name;
        const state = document.createElement("span");
        state.className = "state " + doc.state;
        state.textContent = STATE_LABEL[doc.state] || doc.state;
        const edit = document.createElement("button");
        edit.type = "button";
        edit.className = "ghost";
        edit.textContent = "Edit";
        edit.disabled = rebuilding;
        edit.addEventListener("click", () => editDoc(doc.name));
        const del = document.createElement("button");
        del.type = "button";
        del.className = "ghost";
        del.textContent = "Delete";
        del.disabled = rebuilding;
        del.addEventListener("click", () => removeDoc(doc.name));
        if (doc.pending) {
          const pending = document.createElement("span");
          pending.className = "state pending";
          pending.textContent = "pending";
          row.append(left, state, pending, edit, del);
        } else {
          row.append(left, state, edit, del);
        }
        if (doc.state === "missing_on_disk") {
          del.hidden = true;
          edit.hidden = true;
        }
        docList.appendChild(row);
      }
    }

    function renderReview(items, unreadable) {
      proposals = items || [];
      reviewList.replaceChildren();
      if (unreadable) {
        reviewStatus.textContent = "One record could not be read.";
        reviewStatus.className = "err";
      } else if (!proposals.length) {
        reviewStatus.textContent = "";
        reviewStatus.className = "";
      } else {
        reviewStatus.textContent = "";
        reviewStatus.className = "";
      }
      if (!proposals.length) {
        const empty = document.createElement("p");
        empty.className = "preview";
        empty.textContent = "No pending changes.";
        reviewList.appendChild(empty);
        return;
      }
      for (const item of proposals) {
        const row = document.createElement("div");
        row.className = "row";
        const left = document.createElement("div");
        left.textContent = item.target;
        const op = document.createElement("span");
        op.className = "state";
        op.textContent = item.op === "delete" ? "Delete" : "Update";
        const origin = document.createElement("span");
        origin.className = "state";
        origin.textContent = item.origin === "ai" ? "Formatted" : "Hand edit";
        row.append(left, op, origin);
        if (item.format_error) {
          const failed = document.createElement("span");
          failed.className = "format-failed";
          failed.textContent = "Formatting failed";
          row.appendChild(failed);
        }
        if (item.op !== "delete") {
          const edit = document.createElement("button");
          edit.type = "button";
          edit.className = "ghost";
          edit.textContent = "Edit";
          edit.disabled = rebuilding;
          edit.addEventListener("click", () => openEditor(item));
          row.appendChild(edit);
        }
        const approve = document.createElement("button");
        approve.type = "button";
        approve.textContent = "Approve";
        approve.disabled = rebuilding;
        approve.addEventListener("click", () => approveProposal(item.target));
        const reject = document.createElement("button");
        reject.type = "button";
        reject.className = "ghost";
        reject.textContent = "Reject";
        reject.disabled = rebuilding;
        reject.addEventListener("click", () => rejectProposal(item.target));
        row.append(approve, reject);
        reviewList.appendChild(row);
      }
    }

    function openEditor(item) {
      openTarget = item.target;
      draft.value = item.body || "";
      editor.hidden = false;
      editorStatus.textContent = item.format_error || "";
      editorStatus.className = item.format_error ? "err" : "";
      draft.focus();
    }

    function closeEditor() {
      openTarget = null;
      editor.hidden = true;
      draft.value = "";
      editorStatus.textContent = "";
    }

    async function refreshLibrary() {
      if (isOffline()) {
        setLibStatus("You're offline.", "err");
        return;
      }
      try {
        const res = await fetch("/api/docs");
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          setLibStatus(body.detail || "Could not load documents.", "err");
          return;
        }
        if (body.rebuilding) {
          setRebuildLock(true);
          renderDocs(body.docs || []);
          setLibStatus("Rebuilding…");
          startRebuildPoll();
          return;
        }
        stopRebuildPoll();
        setRebuildLock(false);
        renderDocs(body.docs || []);
        const n = body.num_chunks;
        const ahead = (body.docs || []).some((doc) => doc.state !== "indexed");
        let line = n != null ? `${body.docs.length} files · ${n} chunks indexed` : "Ready";
        if (ahead) line += " · Re-index to update search";
        setLibStatus(line);
      } catch (err) {
        setLibStatus("You're offline.", "err");
      }
    }

    async function refreshReview() {
      if (isOffline()) {
        reviewStatus.textContent = "You're offline.";
        reviewStatus.className = "err";
        return;
      }
      try {
        const res = await fetch("/api/review");
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          reviewStatus.textContent = detail(body, "Could not load the queue.");
          reviewStatus.className = "err";
          return;
        }
        renderReview(body.proposals || [], body.unreadable || 0);
      } catch (err) {
        reviewStatus.textContent = "You're offline.";
        reviewStatus.className = "err";
      }
    }

    async function refreshAll() {
      await refreshLibrary();
      await refreshReview();
    }

    async function removeDoc(name) {
      if (!confirm(`Stage deletion of ${name}? It stays on disk and searchable until you approve it and re-index.`)) return;
      if (isOffline()) { setLibStatus("You're offline.", "err"); return; }
      try {
        const res = await fetch("/api/docs/" + encPath(name), { method: "DELETE" });
        const body = await res.json().catch(() => ({}));
        if (res.status === 409) {
          setRebuildLock(true);
          setLibStatus("Index is rebuilding. Try again when it finishes.", "err");
          startRebuildPoll();
          return;
        }
        if (!res.ok) { setLibStatus(detail(body, "Delete failed"), "err"); return; }
        renderDocs(body.docs);
        renderReview(body.proposals || [], body.unreadable || 0);
        setLibStatus("Staged for review.");
      } catch (err) {
        setLibStatus("You're offline.", "err");
      }
    }

    async function editDoc(name) {
      const pending = proposals.find((item) => item.target === name);
      if (pending && pending.op === "delete") {
        reviewStatus.textContent = "Reject the pending delete before editing this file.";
        reviewStatus.className = "err";
        return;
      }
      if (pending) {
        openEditor(pending);
        return;
      }
      if (isOffline()) { setLibStatus("You're offline.", "err"); return; }
      try {
        const res = await fetch("/api/docs/" + encPath(name));
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          setLibStatus(detail(body, "Could not open the file."), "err");
          return;
        }
        openEditor({ target: name, body: body.body || "", format_error: null });
      } catch (err) {
        setLibStatus("You're offline.", "err");
      }
    }

    async function putDraft() {
      const res = await fetch("/api/review/" + encPath(openTarget), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ body: draft.value }),
      });
      const body = await res.json().catch(() => ({}));
      return { res, body };
    }

    function showEditorError(res, body, fallback) {
      if (res.status === 409 && detail(body, "") === "Index is rebuilding. Try again when it finishes.") {
        setRebuildLock(true);
        editorStatus.textContent = "Index is rebuilding. Try again when it finishes.";
        editorStatus.className = "err";
        startRebuildPoll();
        return;
      }
      editorStatus.textContent = detail(body, fallback);
      editorStatus.className = "err";
    }

    saveBtn.addEventListener("click", async () => {
      if (!openTarget) return;
      if (isOffline()) { editorStatus.textContent = "You're offline."; editorStatus.className = "err"; return; }
      try {
        const { res, body } = await putDraft();
        if (!res.ok) { showEditorError(res, body, "Save failed"); return; }
        renderDocs(body.docs || []);
        renderReview(body.proposals || [], body.unreadable || 0);
        editorStatus.textContent = "Draft saved.";
        editorStatus.className = "";
      } catch (err) {
        editorStatus.textContent = "You're offline.";
        editorStatus.className = "err";
      }
    });

    formatBtn.addEventListener("click", async () => {
      if (!openTarget) return;
      if (isOffline()) { editorStatus.textContent = "You're offline."; editorStatus.className = "err"; return; }
      try {
        const saved = await putDraft();
        if (!saved.res.ok) { showEditorError(saved.res, saved.body, "Save failed"); return; }
        const res = await fetch("/api/review/" + encPath(openTarget) + "/format", { method: "POST" });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) { showEditorError(res, body, "Formatting failed"); return; }
        renderDocs(body.docs || []);
        renderReview(body.proposals || [], body.unreadable || 0);
        if (body.proposal) openEditor(body.proposal);
        editorStatus.textContent = "Formatted. Approve to write the live file.";
        editorStatus.className = "";
      } catch (err) {
        editorStatus.textContent = "You're offline.";
        editorStatus.className = "err";
      }
    });

    async function approveProposal(name) {
      if (isOffline()) { setLibStatus("You're offline.", "err"); return; }
      try {
        if (openTarget === name && !editor.hidden) {
          const saved = await putDraft();
          if (!saved.res.ok) { showEditorError(saved.res, saved.body, "Save failed"); return; }
        }
        const res = await fetch("/api/review/" + encPath(name) + "/approve", { method: "POST" });
        const body = await res.json().catch(() => ({}));
        if (res.status === 409 && detail(body, "").indexOf("rebuilding") !== -1) {
          setRebuildLock(true);
          setLibStatus("Index is rebuilding. Try again when it finishes.", "err");
          startRebuildPoll();
          return;
        }
        if (!res.ok) {
          if (openTarget === name) showEditorError(res, body, "Approve failed");
          else setLibStatus(detail(body, "Approve failed"), "err");
          return;
        }
        renderDocs(body.docs || []);
        renderReview(body.proposals || [], body.unreadable || 0);
        if (openTarget === name) closeEditor();
        setLibStatus("Approved. Re-index to update search.", "ok");
      } catch (err) {
        setLibStatus("You're offline.", "err");
      }
    }

    async function rejectProposal(name) {
      if (isOffline()) { setLibStatus("You're offline.", "err"); return; }
      try {
        const res = await fetch("/api/review/" + encPath(name), { method: "DELETE" });
        const body = await res.json().catch(() => ({}));
        if (res.status === 409) {
          setRebuildLock(true);
          setLibStatus("Index is rebuilding. Try again when it finishes.", "err");
          startRebuildPoll();
          return;
        }
        if (!res.ok) { setLibStatus(detail(body, "Reject failed"), "err"); return; }
        renderDocs(body.docs || []);
        renderReview(body.proposals || [], body.unreadable || 0);
        if (openTarget === name) closeEditor();
        setLibStatus("Rejected.");
      } catch (err) {
        setLibStatus("You're offline.", "err");
      }
    }

    approveBtn.addEventListener("click", () => {
      if (openTarget) approveProposal(openTarget);
    });

    reloadBtn.addEventListener("click", async () => {
      if (!openTarget) return;
      if (isOffline()) { editorStatus.textContent = "You're offline."; editorStatus.className = "err"; return; }
      try {
        const res = await fetch("/api/docs/" + encPath(openTarget));
        const body = await res.json().catch(() => ({}));
        if (res.status === 404) {
          editorStatus.textContent = "No live file yet.";
          editorStatus.className = "err";
          return;
        }
        if (!res.ok) { showEditorError(res, body, "Could not load the live file."); return; }
        draft.value = body.body || "";
        editorStatus.textContent = "Loaded the live file. Save draft to keep it.";
        editorStatus.className = "";
      } catch (err) {
        editorStatus.textContent = "You're offline.";
        editorStatus.className = "err";
      }
    });

    uploadBtn.addEventListener("click", () => {
      if (isOffline()) { setLibStatus("You're offline.", "err"); return; }
      fileInput.click();
    });
    fileInput.addEventListener("change", async () => {
      const files = fileInput.files;
      if (!files || !files.length) return;
      if (isOffline()) { setLibStatus("You're offline.", "err"); return; }
      const fd = new FormData();
      for (const f of files) fd.append("files", f);
      try {
        const res = await fetch("/api/docs", { method: "POST", body: fd });
        fileInput.value = "";
        const body = await res.json().catch(() => ({}));
        if (res.status === 409) {
          setRebuildLock(true);
          setLibStatus("Index is rebuilding. Try again when it finishes.", "err");
          startRebuildPoll();
          return;
        }
        if (body.docs) renderDocs(body.docs);
        if (body.proposals) renderReview(body.proposals, body.unreadable || 0);
        if (res.status === 207 || (body.errors && body.errors.length)) {
          const msg = (body.errors || []).map((e) => e.message).filter(Boolean).join(" ") || "Upload failed";
          setLibStatus(msg, "err");
          return;
        }
        if (!res.ok) {
          setLibStatus(detail(body, "Upload failed"), "err");
          return;
        }
        setLibStatus("Staged for review.");
      } catch (err) {
        fileInput.value = "";
        setLibStatus("You're offline.", "err");
      }
    });

    reindexBtn.addEventListener("click", async () => {
      if (isOffline()) { setLibStatus("You're offline.", "err"); return; }
      setRebuildLock(true);
      setLibStatus("Rebuilding…");
      try {
        const res = await fetch("/api/reindex", { method: "POST" });
        const body = await res.json().catch(() => ({}));
        if (res.status === 409) {
          setLibStatus("Index is rebuilding. Try again when it finishes.", "err");
          startRebuildPoll();
          return;
        }
        setRebuildLock(false);
        await refreshAll();
        if (!res.ok) setLibStatus(body.detail || "Re-index failed", "err");
        else setLibStatus("Indexed " + body.num_chunks + " chunks.", "ok");
      } catch (err) {
        setLibStatus("You're offline.", "err");
        startRebuildPoll();
      }
    });

    window.addEventListener("offline", () => {
      setLibStatus("You're offline.", "err");
      reviewStatus.textContent = "You're offline.";
      reviewStatus.className = "err";
    });

    async function init() {
      if (isOffline()) {
        setLibStatus("You're offline.", "err");
        reviewStatus.textContent = "You're offline.";
        reviewStatus.className = "err";
        return;
      }
      try {
        const statusRes = await fetch("/api/status");
        const status = await statusRes.json().catch(() => ({}));
        if (status.rebuilding) {
          setRebuildLock(true);
          setLibStatus("Rebuilding…");
          startRebuildPoll();
        }
      } catch (err) {
        setLibStatus("You're offline.", "err");
      }
      await refreshAll();
    }
    init();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
